components:
  schemas:
    PostUdfNewResponse:
      type: object
      properties:
        shared_token:
          type: string
          description: Included when create_shared_token is true
    PostUdfNewRequest:
      type: object
      properties:
        slug:
          type: string
          description: URL-safe name
        udf_body:
          type: string
          description: The UDF source and metadata
        udf_type:
          type: string
          description: Use auto
        collection_id:
          type: string
          description: Canvas to add the UDF to
        create_shared_token:
          type: boolean
          description: Also mint a shared token. Default false.
        shared_token_access_scope:
          type: string
          description: public or team. Default team.
      required:
      - slug
      - udf_body
      - udf_type
    PostUdfByIdUdfidRequest:
      type: object
      properties:
        slug:
          type: string
          description: Slug to change
        udf_body:
          type: string
          description: UDF source to change
        collection_id:
          type: string
          description: Collection to change
    GetUdfSelfResponse:
      type: object
      properties:
        id:
          type: string
          description: UDF id
        slug:
          type: string
          description: URL-safe name, unique within a canvas
        udf_body:
          type: string
          description: The UDF source and metadata
        collection_id:
          type: string
          description: Canvas the UDF belongs to
        collection_name:
          type: string
          description: Canvas name
        is_visible:
          type: boolean
          description: Whether the UDF is shown on its canvas
        position:
          type: integer
          description: Ordering on the canvas
        udf_body_hash:
          type: string
          description: Hash of udf_body , for change detection
        last_updated:
          type: string
          description: Last modification timestamp
        owning_user:
          type: object
          description: Owner summary
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
